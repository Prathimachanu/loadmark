[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loadmark"
version = "0.1.0"
description = "A safe bookmark (checkpoint) for incremental data loads: only moves forward on success, with lookback, backfill and run history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Prathima", email = "prathimachanu@gmail.com" }]
keywords = ["etl", "data-engineering", "incremental-load", "checkpoint", "watermark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
]
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/prathimachanu/loadmark"
Issues = "https://github.com/prathimachanu/loadmark/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/loadmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
