name: Publish to PyPI

# Runs when you create a "Release" on GitHub.
# Needs the one-time "Trusted Publisher" setup on pypi.org (see PUBLISHING.md, Part 8).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build pytest && pip install -e . && pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
